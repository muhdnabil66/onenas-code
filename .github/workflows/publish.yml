name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run packages/opencode/script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ github.ref_name }}
          OPENCODE_RELEASE: true

      - name: Rename binaries to onenas
        run: |
          cd packages/opencode/dist
          for f in $(find . -name "opencode" -type f -executable); do
            dir=$(dirname "$f")
            name=$(basename "$f")
            mv "$f" "$dir/onenas"
          done
          for f in $(find . -name "opencode.exe" -type f); do
            dir=$(dirname "$f")
            name=$(basename "$f")
            mv "$f" "$dir/onenas.exe"
          done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: onenas-binary
          path: |
            packages/opencode/dist/opencode-windows-x64/bin/onenas.exe
            packages/opencode/dist/opencode-linux-x64/bin/onenas
            packages/opencode/dist/opencode-darwin-arm64/bin/onenas
            packages/opencode/dist/opencode-darwin-x64/bin/onenas

      - name: Verify binary
        run: |
          if [ -f packages/opencode/dist/opencode-windows-x64/bin/onenas.exe ]; then
            file packages/opencode/dist/opencode-windows-x64/bin/onenas.exe
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: onenas-binary
          path: packages/opencode/dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: packages/opencode/dist/**/*.{exe,zip,tar.gz}
          draft: false
          prerelease: false
          body: |
            ## ONeNas Code ${{ github.ref_name }}
            
            - ONeNas Code BY AtlasFlux
            - AI coding agent CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        run: npm publish packages/onenas-cli --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}